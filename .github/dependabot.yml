version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"
          - "vitest"
          - "typescript"
          - "tsx"
          - "vite"
          - "@vitejs/*"
      types:
        patterns:
          - "@types/*"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
